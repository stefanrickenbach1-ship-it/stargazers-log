<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal log of starred GitHub repositories." />
    <title>Starred repositories</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Stargazers log</p>
        <h1>Starred repositories</h1>
        <p class="intro">A small, useful shelf for projects worth coming back to.</p>
      </header>

      <section aria-labelledby="repository-heading">
        <div class="section-heading">
          <h2 id="repository-heading">Recently starred</h2>
          <span class="repository-count" id="repository-count" aria-live="polite"></span>
        </div>
        <div class="repository-list" id="repository-list" aria-live="polite">
          <p class="status-message">Loading repositories...</p>
        </div>
      </section>
    </main>
  </body>
</html>
